# GS AUTOBILAN — Docker Compose stack (S087)
# Usage: copy .env.docker.example → .env.docker, then:
#   docker compose --env-file .env.docker up -d --build
# Verify in S088.

name: gs-autobilan

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: gs-autobilan-app:latest
    container_name: gs-autobilan-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: .env.docker.example
        required: false
      - path: .env.docker
        required: false
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gs_autobilan

  nginx:
    image: nginx:1.27-alpine
    container_name: gs-autobilan-nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gs_autobilan

  mysql:
    image: mysql:8.4
    container_name: gs-autobilan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gs_autobilan}
      MYSQL_USER: ${DB_USERNAME:-gs_autobilan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gs_autobilan_docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_docker_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - gs_autobilan

  redis:
    image: redis:7-alpine
    container_name: gs-autobilan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    networks:
      - gs_autobilan

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: gs-autobilan-app:latest
    container_name: gs-autobilan-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: .env.docker.example
        required: false
      - path: .env.docker
        required: false
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --no-interaction
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - gs_autobilan

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: gs-autobilan-app:latest
    container_name: gs-autobilan-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: .env.docker.example
        required: false
      - path: .env.docker
        required: false
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - gs_autobilan

networks:
  gs_autobilan:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  vendor_data:
  node_modules_data:
  storage_app:
  storage_logs:
